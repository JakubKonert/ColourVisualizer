<div class="card shadow">
  <div class="card-body">
<h6 class="card-title mb-3 d-flex flex-wrap align-items-center gap-2">
  Id: {{ id }} |

  <span>
    main: {{ mainColor }}
    <span class="color-box" [ngStyle]="{ backgroundColor: mainColor }"></span>
  </span>

  <span>
    secondary: {{ secondaryColor }}
    <span class="color-box" [ngStyle]="{ backgroundColor: secondaryColor }"></span>
  </span>
</h6>

    <div class="btn-pair justify-content-center">
      <button class="btn text-white" [ngStyle]="{ backgroundColor: mainColor }">Main</button>
      <button class="btn text-white" [ngStyle]="{ backgroundColor: secondaryColor }">Secondary</button>
    </div>

    <div class="btn-pair justify-content-center">
      <button class="btn text-dark" [ngStyle]="{ backgroundColor: mainColor }">Main</button>
      <button class="btn text-dark" [ngStyle]="{ backgroundColor: secondaryColor }">Secondary</button>
    </div>

    <div class="btn-pair justify-content-center">
      <button class="btn" [ngStyle]="{ backgroundColor: mainColor, color: secondaryColor }">Main</button>
      <button class="btn" [ngStyle]="{ backgroundColor: secondaryColor, color: mainColor }">Secondary</button>
    </div>

    <div class="btn-pair justify-content-center">
      <button  [ngStyle]="{ borderColor: mainColor, color: mainColor }" style="background-color: transparent; border-style: solid;">
        Main
      </button>
      <button  [ngStyle]="{ borderColor: secondaryColor, color: secondaryColor }" style="background-color: transparent; border-style: solid;">
        Secondary
      </button>
    </div>

        <div class="btn-pair justify-content-center">
      <button  class="btn rounded-3" [ngStyle]="{ borderColor: mainColor, color: mainColor }" style="background-color: transparent; border-style: solid;">
        Main
      </button>
      <button class="btn rounded-3" [ngStyle]="{ borderColor: secondaryColor, color: secondaryColor }" style="background-color: transparent; border-style: solid;">
        Secondary
      </button>
    </div>

    <div class="btn-pair justify-content-center">
      <button class="btn text-white rounded-3" [ngStyle]="{ backgroundColor: mainColor }">Main Rounded</button>
      <button class="btn text-white rounded-3" [ngStyle]="{ backgroundColor: secondaryColor }">Secondary Rounded</button>
    </div>
    <div class="btn-pair justify-content-center">
      <button class="btn text-dark rounded-3" [ngStyle]="{ backgroundColor: mainColor }">Main Rounded</button>
      <button class="btn text-dark rounded-3" [ngStyle]="{ backgroundColor: secondaryColor }">Secondary Rounded</button>
    </div>

    <div class="btn-pair justify-content-center">
      <button class="btn rounded-3" [ngStyle]="{ backgroundColor: mainColor , color: secondaryColor}">Main Rounded</button>
      <button class="btn rounded-3" [ngStyle]="{ backgroundColor: secondaryColor, color: mainColor}">Secondary Rounded</button>
    </div>
  </div>
</div>
